<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Job Management Board</title>
    <!-- CSS Link Correct Location -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Job Management Portal</h1>

        <!-- ADD JOB FORM -->
        <h2>Add New Job</h2>
        <form id="jobForm">

            <input type="text" id="title" placeholder="Job Title" required>
            <input type="text" id="company" placeholder="Company" required>
            <input type="text" id="location" placeholder="Location" required>
            <input type="text" id="salary" placeholder="Salary">
            <textarea id="description" placeholder="Job Description" required></textarea>
            <input type="text" id="skills" placeholder="Skills (comma separated)">

            <button type="submit">Add Job</button>

        </form>

        <hr>

        <!-- UPDATE SALARY SECTION -->
        <h2>Update Job Salary</h2>
        <input type="text" id="jobId" placeholder="Job ID for update">
        <button type="button" onclick="updateSalary()">Update Salary</button>

        <p id="message"></p>

        <hr>

        <!-- LIVE JOBS LIST SECTION -->
        <h2>All Available Jobs</h2>
        <button type="button" onclick="fetchJobs()">Refresh Jobs List</button>
        <div id="jobsContainer" style="margin-top: 20px;"></div>
    </div>

    <script>
        const API_URL = "/api/jobs";

        // Automatically fetch jobs on page load
        document.addEventListener("DOMContentLoaded", fetchJobs);

        // 1. ADD NEW JOB
        document.getElementById("jobForm").addEventListener("submit", async function(event) {
            event.preventDefault();

            const job = {
                title: document.getElementById("title").value,
                company: document.getElementById("company").value,
                location: document.getElementById("location").value,
                description: document.getElementById("description").value,
                salary: document.getElementById("salary").value,
                skills: document.getElementById("skills").value.split(",").map(s => s.trim())
            };

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(job)
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage("Job added successfully!", "green");
                    document.getElementById("jobForm").reset();
                    fetchJobs();
                } else {
                    showMessage("Error: " + (data.message || data.error), "red");
                }
            } catch (err) {
                showMessage("Error: Server connection failed", "red");
            }
        });

        // 2. UPDATE SALARY
        async function updateSalary() {
            const jobId = document.getElementById("jobId").value.trim();
            const salary = document.getElementById("salary").value.trim();

            if (!jobId || !salary) {
                showMessage("Error: Enter both Job ID and new Salary (in main Salary field)", "red");
                return;
            }

            try {
                const response = await fetch(`${API_URL}/${jobId}`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ salary: salary })
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage("Salary updated successfully!", "green");
                    document.getElementById("jobId").value = "";
                    document.getElementById("salary").value = "";
                    fetchJobs();
                } else {
                    showMessage("Error: " + (data.message || data.error), "red");
                }
            } catch (err) {
                showMessage("Error: Server connection failed", "red");
            }
        }

        // 3. DELETE JOB
        async function deleteJob(jobId) {
            if (!confirm("Are you sure you want to delete this job?")) return;

            try {
                const response = await fetch(`${API_URL}/${jobId}`, {
                    method: "DELETE"
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage("Job deleted successfully!", "green");
                    fetchJobs();
                } else {
                    showMessage("Error: " + (data.message || data.error), "red");
                }
            } catch (err) {
                showMessage("Error: Server connection failed", "red");
            }
        }

        // 4. FETCH ALL JOBS
        async function fetchJobs() {
            const container = document.getElementById("jobsContainer");
            try {
                const response = await fetch(API_URL);
                const jobs = await response.json();

                if (!Array.isArray(jobs) || jobs.length === 0) {
                    container.innerHTML = "<p>No jobs available right now.</p>";
                    return;
                }

                container.innerHTML = jobs.map(job => `
                    <div class="job-card">
                        <p><strong>ID:</strong> ${job._id}</p>
                        <p><strong>Title:</strong> ${job.title}</p>
                        <p><strong>Company:</strong> ${job.company}</p>
                        <p><strong>Location:</strong> ${job.location}</p>
                        <p><strong>Salary:</strong> ${job.salary || 'N/A'}</p>
                        <button class="btn-delete" onclick="deleteJob('${job._id}')">Delete Job</button>
                    </div>
                `).join("");
            } catch (err) {
                container.innerHTML = "<p style='color:red;'>Failed to load jobs list.</p>";
            }
        }

        // Helper function for colored alert messages
        function showMessage(text, color) {
            const msgElement = document.getElementById("message");
            msgElement.innerText = text;
            msgElement.style.color = color;
            msgElement.style.fontWeight = "bold";
        }
    </script>

</body>
</html>
